# Build, attest, and deploy Watchtower to Azure — one action, every push to main.
#
# Flow: exact dependency install -> non-blocking dependency/SBOM diagnostics ->
# source gates (typecheck / lint / test / build / no-postgres) -> docker build a
# digest-pinned candidate and push it to the shared ACR -> non-blocking
# exact-image SBOM + Trivy diagnostics -> non-blocking cosign keyless signing,
# SLSA provenance/SBOM attestation, and verification diagnostics
# -> arm rollback -> stop the web app / repin the container to the exact digest
# / start -> poll /api/live + /api/ready and confirm the web app is pinned to
# the new digest for N consecutive checks -> promote :latest. Any failure after
# the "Arm rollback" step repins the previous digest, restarts, and restores the
# previous :latest.
#
# Watchtower's build identity (/api/version) is a static constant baked into the
# image, so the release check proves "a healthy container booted on the exact
# new digest that the web app is now pinned to", not a per-commit string match.
#
# Azure deployment identity:
#   github-watchtower-ci, with a federated credential for
#     repo:EnzoLopez2023@123000731/Watchtower@1349806476:ref:refs/heads/main
#   and these role assignments:
#     - AcrPush on registry acrenzolopez01
#     - Website Contributor (or Contributor) on web app app-watchtower-prod-...
#
# Manual rollback (if this workflow itself is broken) — replace <PREV_DIGEST>:
#   az webapp config container set -g rg-personal-apps-prod \
#     -n app-watchtower-prod-lwxhu7jxlrbtu \
#     --container-image-name acrenzolopez01.azurecr.io/watchtower@sha256:<PREV_DIGEST> \
#     --container-registry-url https://acrenzolopez01.azurecr.io
#   az webapp restart -g rg-personal-apps-prod -n app-watchtower-prod-lwxhu7jxlrbtu

name: Build, attest, and deploy Watchtower to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-watchtower
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RG: rg-personal-apps-prod
  ACR: acrenzolopez01
  ACR_LOGIN_SERVER: acrenzolopez01.azurecr.io
  IMAGE_REPOSITORY: watchtower
  WEBAPP: app-watchtower-prod-lwxhu7jxlrbtu
  PRODUCTION_URL: https://app-watchtower-prod-lwxhu7jxlrbtu.azurewebsites.net
  LIVE_PATH: /api/live
  READY_PATH: /api/ready
  VERSION_PATH: /api/version

  # Watchtower's own GitHub OIDC deploy identity. Shared tenant + subscription
  # with the sibling apps; the client id is app-specific.
  AZURE_CLIENT_ID: 74d75555-da5f-499d-97b2-6f7daea0166f
  AZURE_TENANT_ID: de625678-c55b-4494-9558-14946cbb6133
  AZURE_SUBSCRIPTION_ID: 1cf02211-8d77-4658-bb6a-0f83ec831c3b

  REQUIRED_CONFIRMATIONS: '3'
  MAX_ATTEMPTS: '90'
  ROLLBACK_MAX_ATTEMPTS: '30'
  POLL_INTERVAL_SECONDS: '5'
  HTTP_TIMEOUT_SECONDS: '8'
  DEPLOYMENT_MUTATED: 'false'
  DIAGNOSTIC_RECORDS: deployment-diagnostics/records.jsonl

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm ci --no-audit --no-fund

      - name: Diagnostic — production dependency audit
        id: source_dependency_diagnostic
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-dependency-audit
          category: source-audit
          phase: pre-build
          report: evidence/npm-audit.json
          report-format: npm-audit-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '120000'
          run: |
            mkdir -p evidence
            npm audit --omit=dev --audit-level=high --json > evidence/npm-audit.json

      - name: Diagnostic — source dependency SBOM
        id: source_sbom_diagnostic
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-sbom
          category: sbom
          phase: pre-build
          report: evidence/source-sbom.cdx.json
          report-format: cyclonedx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '120000'
          run: |
            mkdir -p evidence
            npm sbom --sbom-format=cyclonedx > evidence/source-sbom.cdx.json

      - name: Validate source and build
        shell: bash
        run: |
          set -euo pipefail
          npm run check:icons
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run check:no-postgres

      - name: Azure login with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Capture prior release
        shell: bash
        run: |
          set -euo pipefail

          config="$(az webapp config show \
            --resource-group "$RG" --name "$WEBAPP" \
            --query '{image:linuxFxVersion}' \
            --output json)"

          configured_ref="$(jq -r '.image' <<<"$config")"
          configured_ref="${configured_ref#DOCKER|}"
          expected_prefix="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY"
          case "$configured_ref" in
            "$expected_prefix"@sha256:*)
              previous_ref="$configured_ref"
              previous_digest="${configured_ref##*@}"
              ;;
            "$expected_prefix":*)
              previous_spec="${configured_ref#"$ACR_LOGIN_SERVER/"}"
              previous_digest="$(az acr repository show --name "$ACR" \
                --image "$previous_spec" --query digest --output tsv)"
              previous_ref="$expected_prefix@$previous_digest"
              ;;
            *)
              echo "::error::Current image is outside $expected_prefix"
              exit 1
              ;;
          esac
          [[ "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          previous_latest_digest="$(az acr repository show --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" --query digest --output tsv 2>/dev/null || true)"
          [[ "$previous_latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || previous_latest_digest="$previous_digest"

          prev_settings="$(az webapp config appsettings list \
            --resource-group "$RG" --name "$WEBAPP" --output json)"
          prev_build_sha="$(jq -r '(map({(.name): .value}) | add).BUILD_SHA // ""' <<<"$prev_settings")"
          prev_build_id="$(jq -r '(map({(.name): .value}) | add).BUILD_ID // ""' <<<"$prev_settings")"

          prev_version="$(curl -fsS --max-time "$HTTP_TIMEOUT_SECONDS" \
            -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL$VERSION_PATH?deploy-baseline=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>/dev/null || echo '{}')"
          prev_commit="$(jq -r '.deploy.commit // ""' <<<"$prev_version")"

          {
            echo "PREVIOUS_IMAGE_REFERENCE=$previous_ref"
            echo "PREVIOUS_IMAGE_DIGEST=$previous_digest"
            echo "PREVIOUS_LATEST_DIGEST=$previous_latest_digest"
            echo "PREVIOUS_BUILD_SHA_SETTING=$prev_build_sha"
            echo "PREVIOUS_BUILD_ID_SETTING=$prev_build_id"
            echo "PREVIOUS_COMMIT=$prev_commit"
          } >> "$GITHUB_ENV"
          echo "Prior digest $previous_digest, commit ${prev_commit:-unknown}"

      - name: Build, push, and inspect digest-pinned candidate
        id: image
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          repo="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY"
          candidate_tag="$repo:$GITHUB_SHA-$BUILD_ID"

          # The deploy identity holds AcrPush but not the registry-Contributor
          # role az acr build / az acr import need, so the image is built on the
          # runner and pushed with docker. Identity is configured at runtime via
          # /runtime-config.js, so no VITE_* build args are passed (see docs/DEPLOYMENT.md).
          az acr login --name "$ACR"
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$BUILD_ID" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$candidate_tag" \
            .
          docker push "$candidate_tag"

          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$candidate_tag" | sed 's/.*@//')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            digest="$(az acr repository show --name "$ACR" \
              --image "$IMAGE_REPOSITORY:$GITHUB_SHA-$BUILD_ID" --query digest --output tsv)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          image_ref="$repo@$digest"
          docker pull "$image_ref"

          # No Docker VOLUME at or under /home: one would mount an anonymous
          # ephemeral volume that passes every runtime storage probe while
          # silently discarding the SQLite database on every restart.
          docker image inspect "$image_ref" --format '{{json .Config.Volumes}}' \
            | jq -e '[((. // {}) | keys[]) | select(. == "/home" or startswith("/home/"))] | length == 0' > /dev/null
          [[ "$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          [[ "$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" == "$BUILD_ID" ]]

          {
            echo "ref=$image_ref"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_REFERENCE=$image_ref"
            echo "IMAGE_DIGEST=$digest"
            echo "BUILD_ID=$BUILD_ID"
            echo "DIAGNOSTIC_BUILD_ID=$BUILD_ID"
            echo "DIAGNOSTIC_CANDIDATE_DIGEST=$digest"
          } >> "$GITHUB_ENV"

      - name: Generate exact-image SBOM
        id: image_sbom
        timeout-minutes: 5
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: evidence/image-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Diagnostic — record exact-image SBOM
        id: image_sbom_diagnostic
        if: ${{ always() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: image-sbom
          category: sbom
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image_sbom.outcome == 'success' && '0' || '1' }}
          report: evidence/image-sbom.spdx.json
          report-format: spdx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Scan exact image for HIGH and CRITICAL vulnerabilities
        id: image_scan
        timeout-minutes: 12
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: json
          output: evidence/trivy-image.json
          exit-code: '0'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          scanners: vuln
          timeout: 10m

      - name: Diagnostic — record exact-image vulnerability scan
        id: image_scan_diagnostic
        if: ${{ always() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: image-vulnerability-scan
          category: image-scan
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image_scan.outcome == 'success' && '0' || '1' }}
          report: evidence/trivy-image.json
          report-format: trivy-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Install Cosign
        id: cosign_install
        timeout-minutes: 3
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Diagnostic — sign and verify exact image
        id: signature_diagnostic
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: signature-verification
          category: signature-provenance
          phase: pre-activation
          report: evidence/cosign-signature.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '240000'
          run: |
            set -euo pipefail
            if [[ "${{ steps.cosign_install.outcome }}" != "success" ]]; then
              echo "Cosign installer did not complete successfully" >&2
              exit 127
            fi
            workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@$GITHUB_REF"
            cosign sign --yes "$IMAGE_REFERENCE"
            cosign verify \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REFERENCE" > evidence/cosign-signature.json

      - name: Diagnostic — attest and verify provenance and SBOM
        id: provenance_diagnostic
        timeout-minutes: 8
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: provenance-attestation-verification
          category: signature-provenance
          phase: pre-activation
          report: evidence/cosign-attestations.json
          report-format: generic-json
          evidence: |
            evidence/cosign-provenance.json
            evidence/cosign-sbom.json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '420000'
          run: |
            set -euo pipefail
            if [[ "${{ steps.cosign_install.outcome }}" != "success" ]]; then
              echo "Cosign installer did not complete successfully" >&2
              exit 127
            fi
            workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@$GITHUB_REF"
            started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            jq -n \
              --arg buildType "https://github.com/EnzoLopez2023/azure-infra/blob/main/DEPLOYMENT_RUNBOOK.md" \
              --arg repository "git+https://github.com/$GITHUB_REPOSITORY" \
              --arg sha "$GITHUB_SHA" \
              --arg workflow "$workflow_identity" \
              --arg invocation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --arg started "$started_on" \
              '{
                buildDefinition: {
                  buildType: $buildType,
                  externalParameters: { repository: $repository, ref: env.GITHUB_REF },
                  internalParameters: { invocationId: $invocation },
                  resolvedDependencies: [{ uri: $repository, digest: { gitCommit: $sha } }]
                },
                runDetails: {
                  builder: { id: $workflow },
                  metadata: { invocationId: $invocation, startedOn: $started }
                }
              }' > evidence/provenance.slsa.json

            set +e
            provenance_attest_status=0
            cosign attest --yes --predicate evidence/provenance.slsa.json \
              --type slsaprovenance1 "$IMAGE_REFERENCE" || provenance_attest_status=$?

            sbom_attest_status=0
            cosign attest --yes --predicate evidence/image-sbom.spdx.json \
              --type spdxjson "$IMAGE_REFERENCE" || sbom_attest_status=$?

            provenance_status=0
            cosign verify-attestation --type slsaprovenance1 \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REFERENCE" > evidence/cosign-provenance.json || provenance_status=$?

            sbom_status=0
            cosign verify-attestation --type spdxjson \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REFERENCE" > evidence/cosign-sbom.json || sbom_status=$?

            report_status=0
            if [[ -s evidence/cosign-provenance.json && -s evidence/cosign-sbom.json ]]; then
              jq -n \
                --slurpfile provenance evidence/cosign-provenance.json \
                --slurpfile sbom evidence/cosign-sbom.json \
                '{slsaProvenance: $provenance, spdxSbom: $sbom}' \
                > evidence/cosign-attestations.json
              report_status=$?
            else
              report_status=1
            fi

            set -e
            if ((
              provenance_attest_status != 0 ||
              sbom_attest_status != 0 ||
              provenance_status != 0 ||
              sbom_status != 0 ||
              report_status != 0
            )); then
              exit 1
            fi

      - name: Diagnostic — migration compatibility precheck
        id: migration_diagnostic
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: migration-compatibility-precheck
          category: migration-precondition
          phase: pre-activation
          report: evidence/migration-compatibility.json
          report-format: generic-json
          evidence: evidence/migration-compatibility.raw
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '60000'
          run: |
            set -euo pipefail
            current="$(
              curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
                -H 'Cache-Control: no-cache' \
                "$PRODUCTION_URL$READY_PATH?migration-precheck=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            )"
            printf '%s\n' "$current" > evidence/migration-compatibility.raw
            jq -e '
              type == "object" and
              ((.ok | type) == "boolean") and
              ((.authority | type) == "object") and
              ((.authority.schemaVersion | type) == "number") and
              .authority.schemaVersion >= 0 and
              .authority.schemaVersion == (.authority.schemaVersion | floor) and
              ((.authority.migrationCount | type) == "number") and
              .authority.migrationCount >= 0 and
              .authority.migrationCount == (.authority.migrationCount | floor) and
              ((.authority.migrationIdentityDigest | type) == "string") and
              (.authority.migrationIdentityDigest | test("^[0-9a-f]{64}$")) and
              ((.authority.ownedSchemaDigest | type) == "string") and
              (.authority.ownedSchemaDigest | test("^[0-9a-f]{64}$")) and
              ((.authority.expectedOwnedSchemaDigest | type) == "string") and
              (.authority.expectedOwnedSchemaDigest | test("^[0-9a-f]{64}$"))
            ' evidence/migration-compatibility.raw > /dev/null
            current_count="$(
              jq -r '.authority.migrationCount' evidence/migration-compatibility.raw
            )"
            candidate="$(
              node --import tsx --input-type=module --eval '
                import {
                  migrationIdentities,
                  migrationIdentityDigest
                } from "./lib/db/migrate.ts";
                const appliedCount = Number(process.argv[1]);
                const identities = migrationIdentities();
                const prefixAvailable =
                  Number.isSafeInteger(appliedCount) &&
                  appliedCount >= 0 &&
                  appliedCount <= identities.length;
                process.stdout.write(JSON.stringify({
                  maxMigrationVersion: identities.at(-1)?.version ?? 0,
                  migrationCount: identities.length,
                  fullIdentityDigest: migrationIdentityDigest(identities),
                  appliedPrefixIdentityDigest: prefixAvailable
                    ? migrationIdentityDigest(identities.slice(0, appliedCount))
                    : null,
                  prefixAvailable
                }));
              ' "$current_count"
            )"
            jq -e '
              type == "object" and
              ((.maxMigrationVersion | type) == "number") and
              ((.migrationCount | type) == "number") and
              ((.fullIdentityDigest | type) == "string") and
              (.fullIdentityDigest | test("^[0-9a-f]{64}$")) and
              ((.prefixAvailable | type) == "boolean") and
              (
                (.prefixAvailable == false and .appliedPrefixIdentityDigest == null) or
                (
                  .prefixAvailable == true and
                  ((.appliedPrefixIdentityDigest | type) == "string") and
                  (.appliedPrefixIdentityDigest | test("^[0-9a-f]{64}$"))
                )
              )
            ' <<<"$candidate" > /dev/null
            jq -e --argjson candidate "$candidate" \
              '{candidate: $candidate, currentRelease: .}' \
              evidence/migration-compatibility.raw > evidence/migration-compatibility.json
            jq -e '
              .currentRelease.ok == true and
              .candidate.prefixAvailable == true and
              .currentRelease.authority.schemaVersion <= .candidate.maxMigrationVersion and
              .currentRelease.authority.migrationCount <= .candidate.migrationCount and
              .currentRelease.authority.migrationIdentityDigest ==
                .candidate.appliedPrefixIdentityDigest and
              .currentRelease.authority.ownedSchemaDigest ==
                .currentRelease.authority.expectedOwnedSchemaDigest
            ' evidence/migration-compatibility.json > /dev/null

      - name: Diagnostic — backup and recovery precondition
        id: recovery_diagnostic
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: recovery-precondition-precheck
          category: recovery-precondition
          phase: pre-activation
          report: evidence/recovery-precheck.json
          report-format: generic-json
          evidence: evidence/recovery-precheck.raw
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '60000'
          run: |
            set -euo pipefail
            registry_digest="$(
              az acr repository show --name "$ACR" \
                --image "$IMAGE_REPOSITORY@$PREVIOUS_IMAGE_DIGEST" \
                --query digest --output tsv
            )"
            settings="$(
              az webapp config appsettings list \
                --resource-group "$RG" --name "$WEBAPP" --output json
            )"
            jq -e '
              type == "array" and
              all(.[];
                type == "object" and
                ((.name | type) == "string") and
                ((.value | type) == "string"))
            ' <<<"$settings" > /dev/null
            configured_stale_threshold="$(
              jq -r '(map({(.name): .value}) | add).OFFHOST_BACKUP_STALE_HOURS // ""' \
                <<<"$settings"
            )"
            stale_threshold=26
            threshold_matches=false
            if [[ "$configured_stale_threshold" == "$stale_threshold" ]]; then
              threshold_matches=true
            fi
            curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL$READY_PATH?recovery-precheck=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              > evidence/recovery-precheck.raw
            jq -e '
              type == "object" and
              ((.recovery | type) == "object") and
              ((.recovery.enabled | type) == "boolean") and
              ((.recovery.uploadConfigured | type) == "boolean") and
              ((.recovery.restoreVerificationEnabled | type) == "boolean") and
              (
                .recovery.lastOutcome == null or
                (
                  ((.recovery.lastOutcome | type) == "object") and
                  (.recovery.lastOutcome.status |
                    . == "success" or . == "failed" or . == "skipped") and
                  ((.recovery.lastOutcome.at | type) == "number") and
                  .recovery.lastOutcome.at >= 0 and
                  .recovery.lastOutcome.at == (.recovery.lastOutcome.at | floor)
                )
              )
            ' evidence/recovery-precheck.raw > /dev/null
            jq -e \
              --arg reference "$PREVIOUS_IMAGE_REFERENCE" \
              --arg expectedDigest "$PREVIOUS_IMAGE_DIGEST" \
              --arg registryDigest "$registry_digest" \
              --argjson staleThresholdHours "$stale_threshold" \
              --argjson thresholdMatches "$threshold_matches" \
              --argjson nowMs "$(date +%s000)" \
              '{
                rollback: {
                  imageReference: $reference,
                  expectedDigest: $expectedDigest,
                  registryDigest: $registryDigest,
                  resolvable: ($registryDigest == $expectedDigest)
                },
                offhostBackup: {
                  enabled: .recovery.enabled,
                  uploadConfigured: .recovery.uploadConfigured,
                  restoreVerificationEnabled: .recovery.restoreVerificationEnabled,
                  configuredThresholdMatches: $thresholdMatches,
                  staleThresholdHours: $staleThresholdHours,
                  lastOutcome: (
                    if .recovery.lastOutcome == null then null
                    else {
                      status: .recovery.lastOutcome.status,
                      at: .recovery.lastOutcome.at,
                      ageSeconds:
                        ((($nowMs - .recovery.lastOutcome.at) / 1000) | floor),
                      fresh:
                        (($nowMs - .recovery.lastOutcome.at) >= -300000 and
                        ($nowMs - .recovery.lastOutcome.at) <=
                          ($staleThresholdHours * 3600000))
                    }
                    end
                  )
                }
              }' evidence/recovery-precheck.raw > evidence/recovery-precheck.json
            jq -e '
              .rollback.resolvable == true and
              .offhostBackup.enabled == true and
              .offhostBackup.uploadConfigured == true and
              .offhostBackup.restoreVerificationEnabled == true and
              .offhostBackup.configuredThresholdMatches == true and
              .offhostBackup.lastOutcome.status == "success" and
              .offhostBackup.lastOutcome.fresh == true
            ' evidence/recovery-precheck.json > /dev/null

      - name: Diagnostic — pre-activation readiness
        id: readiness_diagnostic
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: readiness-precondition-precheck
          category: readiness-precondition
          phase: pre-activation
          report: evidence/readiness-precheck.json
          report-format: generic-json
          evidence: evidence/readiness-precheck.raw
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '60000'
          run: |
            set -euo pipefail
            curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL$READY_PATH?readiness-precheck=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              > evidence/readiness-precheck.raw
            jq -e '
              type == "object" and
              ((.ok | type) == "boolean") and
              ((.lifecycle | type) == "string") and
              ((.authority | type) == "object") and
              .authority.engine == "sqlite" and
              .authority.path == "/home/data/watchtower.db" and
              ((.authority.journalMode | type) == "string") and
              ((.authority.journalMode | ascii_downcase) == "delete") and
              ((.authority.schemaVersion | type) == "number") and
              .authority.schemaVersion >= 0 and
              .authority.schemaVersion == (.authority.schemaVersion | floor) and
              ((.authority.migrationCount | type) == "number") and
              .authority.migrationCount >= 0 and
              .authority.migrationCount == (.authority.migrationCount | floor) and
              ((.authority.migrationIdentityDigest | type) == "string") and
              (.authority.migrationIdentityDigest | test("^[0-9a-f]{64}$")) and
              ((.authority.ownedTableCount | type) == "number") and
              .authority.ownedTableCount >= 0 and
              .authority.ownedTableCount == (.authority.ownedTableCount | floor) and
              ((.authority.requiredOwnedTableCount | type) == "number") and
              .authority.requiredOwnedTableCount >= 0 and
              .authority.requiredOwnedTableCount ==
                (.authority.requiredOwnedTableCount | floor) and
              .authority.ownedTableCount == .authority.requiredOwnedTableCount and
              ((.authority.ownedSchemaDigest | type) == "string") and
              (.authority.ownedSchemaDigest | test("^[0-9a-f]{64}$")) and
              ((.authority.expectedOwnedSchemaDigest | type) == "string") and
              (.authority.expectedOwnedSchemaDigest | test("^[0-9a-f]{64}$")) and
              .authority.ownedSchemaDigest == .authority.expectedOwnedSchemaDigest and
              ((.workers | type) == "object") and
              (.workers | length) > 0 and
              ([
                "instance-lease",
                "monitoring-archive",
                "offhost-recovery",
                "outage-postmortems",
                "unifi-logs-backfill"
              ] - (.workers | keys) | length) == 0 and
              ([.workers[] |
                ((type == "object") and ((.state | type) == "string"))] |
                all(.))
            ' evidence/readiness-precheck.raw > /dev/null
            jq '.' evidence/readiness-precheck.raw > evidence/readiness-precheck.json
            jq -e '
              .ok == true and
              .lifecycle == "ready" and
              ([.workers[].state] |
                all(. == "healthy" or . == "degraded"))
            ' evidence/readiness-precheck.json > /dev/null

      - name: Diagnostic — monitoring resources
        id: monitoring_diagnostic
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: monitoring-precheck
          category: monitoring-precheck
          phase: pre-activation
          report: evidence/monitor-precheck.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '60000'
          run: |
            set -euo pipefail
            resource_id="$(
              az webapp show --resource-group "$RG" --name "$WEBAPP" \
                --query id --output tsv
            )"
            site="$(
              az webapp config show --resource-group "$RG" --name "$WEBAPP" \
                --query '{healthCheckPath:healthCheckPath, alwaysOn:alwaysOn}' \
                --output json
            )"
            alerts="$(
              az monitor metrics alert list --resource-group "$RG" \
                --query '[].{name:name, enabled:enabled, scopes:scopes, actions:actions}' \
                --output json
            )"
            jq -n \
              --arg resourceId "$resource_id" \
              --arg expectedHealthCheckPath "$LIVE_PATH" \
              --argjson site "$site" \
              --argjson alerts "$alerts" \
              '[
                $alerts[] |
                select(
                  .enabled == true and
                  ((.scopes // []) | index($resourceId)) != null and
                  ((.actions // []) | length) > 0
                ) |
                {
                  name,
                  actionGroups: [.actions[] | .actionGroupId]
                }
              ] as $boundAlerts |
              {
                healthCheckPath: $site.healthCheckPath,
                expectedHealthCheckPath: $expectedHealthCheckPath,
                alwaysOn: $site.alwaysOn,
                enabledBoundAlerts: $boundAlerts
              }' > evidence/monitor-precheck.json
            jq -e '
              .healthCheckPath == .expectedHealthCheckPath and
              .alwaysOn == true and
              (.enabledBoundAlerts | length) > 0
            ' evidence/monitor-precheck.json > /dev/null

      - name: Diagnostic — protected configuration comparison
        id: protected_configuration_diagnostic
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: protected-configuration-precheck
          category: protected-configuration-precheck
          phase: pre-activation
          report: evidence/config-fingerprint.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '60000'
          run: |
            set -euo pipefail
            site="$(
              az webapp config show --resource-group "$RG" --name "$WEBAPP" \
                --query '{
                  alwaysOn:alwaysOn,
                  numberOfWorkers:numberOfWorkers,
                  healthCheckPath:healthCheckPath,
                  linuxFxVersion:linuxFxVersion
                }' --output json
            )"
            webapp="$(
              az webapp show --resource-group "$RG" --name "$WEBAPP" \
                --query '{httpsOnly:httpsOnly}' --output json
            )"
            identity="$(
              az webapp identity show --resource-group "$RG" --name "$WEBAPP" \
                --query '{type:type}' --output json
            )"
            settings="$(
              az webapp config appsettings list \
                --resource-group "$RG" --name "$WEBAPP" --output json
            )"
            jq -e '
              type == "object" and
              ((.alwaysOn | type) == "boolean") and
              ((.numberOfWorkers | type) == "number") and
              ((.healthCheckPath | type) == "string") and
              ((.linuxFxVersion | type) == "string")
            ' <<<"$site" > /dev/null
            jq -e 'type == "object" and ((.httpsOnly | type) == "boolean")' \
              <<<"$webapp" > /dev/null
            jq -e 'type == "object" and ((.type | type) == "string")' \
              <<<"$identity" > /dev/null
            jq -e '
              type == "array" and
              all(.[];
                type == "object" and
                ((.name | type) == "string") and
                ((.value | type) == "string"))
            ' <<<"$settings" > /dev/null
            setting_values="$(jq -c '(map({(.name): .value}) | add) // {}' <<<"$settings")"
            setting_names="$(jq -c 'keys | sort' <<<"$setting_values")"
            setting_mismatches="$(
              jq -cn --argjson actual "$setting_values" '
                [
                  { name: "ADMIN_OID", expected: "d6c36f6e-054c-45b8-9468-16c208628814" },
                  { name: "AZURE_AD_AUDIENCE", expected: "55bf92db-2cec-4e65-ab0d-71bee90d7494" },
                  { name: "AZURE_AD_CLIENT_ID", expected: "55bf92db-2cec-4e65-ab0d-71bee90d7494" },
                  { name: "AZURE_AD_TENANT_ID", expected: "52188f12-db6b-46c6-88ff-08c802f0ed3b" },
                  { name: "AZURE_DEFAULT_RESOURCE_GROUP", expected: "rg-personal-apps-prod" },
                  { name: "BACKUP_ROOT", expected: "/home/data/backups/watchtower" },
                  { name: "DB_PATH", expected: "/home/data/watchtower.db" },
                  { name: "NODE_ENV", expected: "production" },
                  { name: "OFFHOST_BACKUP_STALE_HOURS", expected: "26" },
                  { name: "PORT", expected: "3000" },
                  { name: "SQLITE_JOURNAL_MODE", expected: "DELETE" },
                  { name: "WEBSITES_ENABLE_APP_SERVICE_STORAGE", expected: "true" }
                ] |
                map(select($actual[.name] != .expected) | .name) |
                sort
              '
            )"
            jq -n \
              --argjson site "$site" \
              --argjson webapp "$webapp" \
              --argjson identity "$identity" \
              --argjson settingNames "$setting_names" \
              --argjson settingMismatches "$setting_mismatches" \
              '{
                appSettingNames: $settingNames,
                appSettingMismatches: $settingMismatches,
                siteInvariants: {
                  alwaysOn: $site.alwaysOn,
                  numberOfWorkers: $site.numberOfWorkers,
                  healthCheckPath: $site.healthCheckPath,
                  customContainerConfigured:
                    (($site.linuxFxVersion // "") | startswith("DOCKER|")),
                  httpsOnly: $webapp.httpsOnly,
                  identity: $identity.type
                }
              }' > evidence/config-fingerprint.json
            jq -e --arg healthCheckPath "$LIVE_PATH" '
              [
                "ADMIN_OID",
                "AZURE_AD_AUDIENCE",
                "AZURE_AD_CLIENT_ID",
                "AZURE_AD_TENANT_ID",
                "AZURE_DEFAULT_RESOURCE_GROUP",
                "BACKUP_ROOT",
                "BUILD_ID",
                "BUILD_SHA",
                "DB_PATH",
                "NODE_ENV",
                "OFFHOST_BACKUP_STALE_HOURS",
                "PORT",
                "SQLITE_JOURNAL_MODE",
                "WEBSITES_ENABLE_APP_SERVICE_STORAGE"
              ] as $required |
              ($required - .appSettingNames | length) == 0 and
              (.appSettingMismatches | length) == 0 and
              .siteInvariants.alwaysOn == true and
              .siteInvariants.numberOfWorkers == 1 and
              .siteInvariants.healthCheckPath == $healthCheckPath and
              .siteInvariants.customContainerConfigured == true and
              .siteInvariants.httpsOnly == true and
              (.siteInvariants.identity | contains("SystemAssigned"))
            ' evidence/config-fingerprint.json > /dev/null

      - name: Record diagnostic wrapper execution failures
        id: diagnostic_fallback
        if: ${{ always() }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          SOURCE_DEPENDENCY_STATUS: ${{ steps.source_dependency_diagnostic.outputs.status }}
          SOURCE_DEPENDENCY_OUTCOME: ${{ steps.source_dependency_diagnostic.outcome }}
          SOURCE_SBOM_STATUS: ${{ steps.source_sbom_diagnostic.outputs.status }}
          SOURCE_SBOM_OUTCOME: ${{ steps.source_sbom_diagnostic.outcome }}
          IMAGE_SBOM_STATUS: ${{ steps.image_sbom_diagnostic.outputs.status }}
          IMAGE_SBOM_OUTCOME: ${{ steps.image_sbom_diagnostic.outcome }}
          IMAGE_SCAN_STATUS: ${{ steps.image_scan_diagnostic.outputs.status }}
          IMAGE_SCAN_OUTCOME: ${{ steps.image_scan_diagnostic.outcome }}
          SIGNATURE_STATUS: ${{ steps.signature_diagnostic.outputs.status }}
          SIGNATURE_OUTCOME: ${{ steps.signature_diagnostic.outcome }}
          PROVENANCE_STATUS: ${{ steps.provenance_diagnostic.outputs.status }}
          PROVENANCE_OUTCOME: ${{ steps.provenance_diagnostic.outcome }}
          MIGRATION_STATUS: ${{ steps.migration_diagnostic.outputs.status }}
          MIGRATION_OUTCOME: ${{ steps.migration_diagnostic.outcome }}
          RECOVERY_STATUS: ${{ steps.recovery_diagnostic.outputs.status }}
          RECOVERY_OUTCOME: ${{ steps.recovery_diagnostic.outcome }}
          READINESS_STATUS: ${{ steps.readiness_diagnostic.outputs.status }}
          READINESS_OUTCOME: ${{ steps.readiness_diagnostic.outcome }}
          MONITORING_STATUS: ${{ steps.monitoring_diagnostic.outputs.status }}
          MONITORING_OUTCOME: ${{ steps.monitoring_diagnostic.outcome }}
          PROTECTED_CONFIG_STATUS: ${{ steps.protected_configuration_diagnostic.outputs.status }}
          PROTECTED_CONFIG_OUTCOME: ${{ steps.protected_configuration_diagnostic.outcome }}
        shell: bash
        run: |
          set -uo pipefail
          failures=0

          record_missing() {
            local status="$1"
            local outcome="$2"
            local check_id="$3"
            local category="$4"
            local phase="$5"
            local evidence_path="$6"
            if [[ "$outcome" == "success" && -n "$status" ]]; then
              return
            fi

            args=(
              record
              --check "$check_id"
              --category "$category"
              --phase "$phase"
              --records "$DIAGNOSTIC_RECORDS"
              --exit-code 127
            )
            if [[ -n "$evidence_path" ]]; then
              args+=(--evidence "$evidence_path")
            fi
            if ! node scripts/deployment-diagnostic.mjs "${args[@]}"; then
              echo "::warning title=Deployment diagnostics fallback::$check_id wrapper failed without a status, and its fallback record could not be written."
              failures=1
            fi
          }

          record_missing "$SOURCE_DEPENDENCY_STATUS" "$SOURCE_DEPENDENCY_OUTCOME" \
            source-dependency-audit source-audit pre-build evidence/npm-audit.json
          record_missing "$SOURCE_SBOM_STATUS" "$SOURCE_SBOM_OUTCOME" \
            source-sbom sbom pre-build evidence/source-sbom.cdx.json
          record_missing "$IMAGE_SBOM_STATUS" "$IMAGE_SBOM_OUTCOME" \
            image-sbom sbom pre-activation evidence/image-sbom.spdx.json
          record_missing "$IMAGE_SCAN_STATUS" "$IMAGE_SCAN_OUTCOME" \
            image-vulnerability-scan image-scan pre-activation evidence/trivy-image.json
          record_missing "$SIGNATURE_STATUS" "$SIGNATURE_OUTCOME" \
            signature-verification signature-provenance pre-activation evidence/cosign-signature.json
          record_missing "$PROVENANCE_STATUS" "$PROVENANCE_OUTCOME" \
            provenance-attestation-verification signature-provenance pre-activation \
            evidence/cosign-attestations.json
          record_missing "$MIGRATION_STATUS" "$MIGRATION_OUTCOME" \
            migration-compatibility-precheck migration-precondition pre-activation \
            evidence/migration-compatibility.raw
          record_missing "$RECOVERY_STATUS" "$RECOVERY_OUTCOME" \
            recovery-precondition-precheck recovery-precondition pre-activation \
            evidence/recovery-precheck.raw
          record_missing "$READINESS_STATUS" "$READINESS_OUTCOME" \
            readiness-precondition-precheck readiness-precondition pre-activation \
            evidence/readiness-precheck.raw
          record_missing "$MONITORING_STATUS" "$MONITORING_OUTCOME" \
            monitoring-precheck monitoring-precheck pre-activation evidence/monitor-precheck.json
          record_missing "$PROTECTED_CONFIG_STATUS" "$PROTECTED_CONFIG_OUTCOME" \
            protected-configuration-precheck protected-configuration-precheck pre-activation \
            evidence/config-fingerprint.json

          exit "$failures"

      - name: Warn when diagnostic fallback evidence cannot be written
        if: ${{ always() && steps.diagnostic_fallback.outcome != 'success' }}
        shell: bash
        run: >-
          echo "::warning title=Deployment diagnostics fallback::One or more
          diagnostic wrappers failed without a status, and the best-effort
          fallback evidence writer did not complete. Inspect the failed wrapper
          annotations and logs."

      - name: Refresh Azure login before production activation
        timeout-minutes: 5
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Arm rollback before production mutation
        shell: bash
        run: echo "DEPLOYMENT_MUTATED=true" >> "$GITHUB_ENV"

      - name: Activate inspected digest as production release
        shell: bash
        run: |
          set -euo pipefail

          az webapp stop --resource-group "$RG" --name "$WEBAPP" --output none
          absent=0
          for attempt in $(seq 1 60); do
            state="$(az webapp show --resource-group "$RG" --name "$WEBAPP" --query state --output tsv)"
            status="$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?stop-proof=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)"
            if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
              absent=$((absent + 1)); [[ "$absent" -ge 3 ]] && break
            else
              absent=0
            fi
            sleep 2
          done
          [[ "$absent" -ge 3 ]]

          az webapp config container set --resource-group "$RG" --name "$WEBAPP" \
            --container-image-name "$IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" --output none
          [[ "$(az webapp config show --resource-group "$RG" --name "$WEBAPP" \
            --query linuxFxVersion --output tsv)" == "DOCKER|$IMAGE_REFERENCE" ]]

          # /api/version echoes these back as .deploy.commit / .deploy.buildId.
          az webapp config appsettings set --resource-group "$RG" --name "$WEBAPP" \
            --settings "BUILD_SHA=$GITHUB_SHA" "BUILD_ID=$BUILD_ID" --output none

          az webapp start --resource-group "$RG" --name "$WEBAPP" --output none

      - name: Verify the new digest is the live release
        shell: bash
        run: |
          set -euo pipefail
          confirm=0
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            nonce="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            live="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?probe=$nonce" 2>/dev/null || true)"
            ready="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$READY_PATH?probe=$nonce" 2>/dev/null || echo '{}')"
            ver="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$VERSION_PATH?probe=$nonce" 2>/dev/null || echo '{}')"
            pinned="$(az webapp config show --resource-group "$RG" --name "$WEBAPP" \
              --query linuxFxVersion --output tsv 2>/dev/null || true)"

            commit="$(jq -r '.deploy.commit // ""' <<<"$ver" 2>/dev/null || echo "")"
            build_id="$(jq -r '.deploy.buildId // ""' <<<"$ver" 2>/dev/null || echo "")"

            ok=1
            [[ "$live" == "200" ]] || ok=0
            jq -e '.ok == true' <<<"$ready" > /dev/null 2>&1 || ok=0
            [[ "$pinned" == "DOCKER|$IMAGE_REFERENCE" ]] || ok=0
            [[ "$commit" == "$GITHUB_SHA" ]] || ok=0
            [[ "$build_id" == "$BUILD_ID" ]] || ok=0

            if [[ "$ok" == "1" ]]; then
              confirm=$((confirm + 1))
              echo "exact confirmation $confirm/$REQUIRED_CONFIRMATIONS (attempt $attempt)"
              [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]] && break
            else
              [[ "$confirm" -gt 0 ]] && echo "streak reset at attempt $attempt (live=$live commit=${commit:-none} buildId=${build_id:-none} pinned=${pinned:-none})"
              confirm=0
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]]

          [[ "$(az acr repository show --name "$ACR" \
            --image "$IMAGE_REPOSITORY:$GITHUB_SHA-$BUILD_ID" --query digest --output tsv)" == "$IMAGE_DIGEST" ]]

      - name: Promote verified digest to :latest
        shell: bash
        run: |
          set -euo pipefail
          latest="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          docker tag "$IMAGE_REFERENCE" "$latest"
          docker push "$latest"
          [[ "$(az acr repository show --name "$ACR" --image "$IMAGE_REPOSITORY:latest" \
            --query digest --output tsv)" == "$IMAGE_DIGEST" ]]

      - name: Confirm promoted release
        shell: bash
        run: |
          set -euo pipefail
          confirm=0
          for attempt in $(seq 1 12); do
            ver="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$VERSION_PATH?promoted=$GITHUB_RUN_ID-$attempt" 2>/dev/null || echo '{}')"
            if [[ "$(jq -r '.deploy.commit // ""' <<<"$ver")" == "$GITHUB_SHA" ]]; then
              confirm=$((confirm + 1)); [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]] && break
            else
              confirm=0
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]]

      - name: Record deployment evidence
        env:
          IMAGE_SBOM_DIAGNOSTIC_STATUS: ${{ steps.image_sbom_diagnostic.outputs.status }}
          IMAGE_SCAN_DIAGNOSTIC_STATUS: ${{ steps.image_scan_diagnostic.outputs.status }}
          SIGNATURE_DIAGNOSTIC_STATUS: ${{ steps.signature_diagnostic.outputs.status }}
          PROVENANCE_DIAGNOSTIC_STATUS: ${{ steps.provenance_diagnostic.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg buildId "$BUILD_ID" \
            --arg image "$IMAGE_REFERENCE" \
            --arg previous "$PREVIOUS_IMAGE_REFERENCE" \
            --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg imageSbomStatus "$IMAGE_SBOM_DIAGNOSTIC_STATUS" \
            --arg imageScanStatus "$IMAGE_SCAN_DIAGNOSTIC_STATUS" \
            --arg signatureStatus "$SIGNATURE_DIAGNOSTIC_STATUS" \
            --arg provenanceStatus "$PROVENANCE_DIAGNOSTIC_STATUS" \
            'def status($value): if $value == "" then null else $value end;
              {
                sha: $sha,
                buildId: $buildId,
                image: $image,
                previousImage: $previous,
                workflowRun: $run,
                confirmations: 3,
                signed: ($signatureStatus == "pass"),
                provenanceAttested: ($provenanceStatus == "pass"),
                sbomAttested: ($provenanceStatus == "pass"),
                rollbackPerformed: false,
                supplyChainDiagnostics: {
                  imageSbom: status($imageSbomStatus),
                  imageVulnerabilityScan: status($imageScanStatus),
                  signature: status($signatureStatus),
                  provenanceAndSbomAttestation: status($provenanceStatus)
                }
              }' > evidence/deployment.json
          {
            echo "### Watchtower deployed"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Image: \`$IMAGE_REFERENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore prior release after failure or cancellation
        if: ${{ always() && (failure() || cancelled()) && env.DEPLOYMENT_MUTATED == 'true' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "::warning::Restoring prior Watchtower release $PREVIOUS_IMAGE_REFERENCE"

          az webapp stop --resource-group "$RG" --name "$WEBAPP" --output none
          absent=0
          for attempt in $(seq 1 "$ROLLBACK_MAX_ATTEMPTS"); do
            state="$(az webapp show --resource-group "$RG" --name "$WEBAPP" --query state --output tsv)"
            status="$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?rollback-stop=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)"
            if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
              absent=$((absent + 1)); [[ "$absent" -ge 3 ]] && break
            else
              absent=0
            fi
            sleep 2
          done

          if [[ -n "$PREVIOUS_IMAGE_REFERENCE" ]]; then
            az webapp config container set --resource-group "$RG" --name "$WEBAPP" \
              --container-image-name "$PREVIOUS_IMAGE_REFERENCE" \
              --container-registry-url "https://$ACR_LOGIN_SERVER" --output none
          fi
          if [[ -n "$PREVIOUS_BUILD_SHA_SETTING" && -n "$PREVIOUS_BUILD_ID_SETTING" ]]; then
            az webapp config appsettings set --resource-group "$RG" --name "$WEBAPP" \
              --settings "BUILD_SHA=$PREVIOUS_BUILD_SHA_SETTING" "BUILD_ID=$PREVIOUS_BUILD_ID_SETTING" --output none
          fi
          az webapp start --resource-group "$RG" --name "$WEBAPP" --output none

          if [[ "$PREVIOUS_LATEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            prev_latest="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$PREVIOUS_LATEST_DIGEST"
            az acr login --name "$ACR" || true
            docker pull "$prev_latest" \
              && docker tag "$prev_latest" "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest" \
              && docker push "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest" || true
          fi

          restored=0
          for attempt in $(seq 1 "$ROLLBACK_MAX_ATTEMPTS"); do
            live="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?rollback-proof=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)"
            ready="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$READY_PATH?rollback-proof=$GITHUB_RUN_ID-$attempt" 2>/dev/null || echo '{}')"
            ver="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$VERSION_PATH?rollback-proof=$GITHUB_RUN_ID-$attempt" 2>/dev/null || echo '{}')"
            pinned="$(az webapp config show --resource-group "$RG" --name "$WEBAPP" \
              --query linuxFxVersion --output tsv 2>/dev/null || true)"
            commit="$(jq -r '.deploy.commit // ""' <<<"$ver")"
            match=1
            [[ "$live" == "200" ]] || match=0
            jq -e '.ok == true' <<<"$ready" > /dev/null 2>&1 || match=0
            [[ "$pinned" == "DOCKER|$PREVIOUS_IMAGE_REFERENCE" ]] || match=0
            if [[ -n "$PREVIOUS_COMMIT" && "$commit" != "$PREVIOUS_COMMIT" ]]; then match=0; fi
            if [[ "$match" == "1" ]]; then
              restored=$((restored + 1)); [[ "$restored" -ge 3 ]] && break
            else
              restored=0
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          [[ "$restored" -ge 3 ]]

          jq -n \
            --arg image "$PREVIOUS_IMAGE_REFERENCE" \
            --arg commit "$PREVIOUS_COMMIT" \
            '{rollbackPerformed: true, restoredImage: $image, restoredCommit: $commit}' \
            > evidence/rollback.json

      - name: Aggregate deployment diagnostics
        id: diagnostics_aggregate
        if: ${{ always() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-activation
          mode: aggregate
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Warn when diagnostic aggregation cannot complete
        if: ${{ always() && steps.diagnostics_aggregate.outcome != 'success' }}
        shell: bash
        run: >-
          echo "::warning title=Deployment diagnostics aggregation::The
          best-effort diagnostic aggregation step failed; inspect individual
          checker annotations and logs."

      - name: Upload nonsecret deployment and diagnostic evidence
        id: evidence_upload
        if: ${{ always() }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-diagnostics/
            evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Warn when deployment evidence cannot be uploaded
        if: ${{ always() && steps.evidence_upload.outcome != 'success' }}
        shell: bash
        run: >-
          echo "::warning title=Deployment diagnostics upload::The best-effort
          deployment evidence upload failed; findings remain visible in checker
          annotations and the job summary."
